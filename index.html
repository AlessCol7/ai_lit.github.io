<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic AI Academy - ADHD Friendly Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
<style>
:root{
  --bg1:#070a1e; --bg2:#160f42; --card:rgba(23,28,70,0.85); --line:rgba(165,155,255,0.28);
  --gold:#ffd86b; --violet:#9f7eff; --cyan:#6be4ff; --pink:#ff7bd5;
  --text:#f2f4ff; --muted:#a9b2e0; --good:#5df2a5; --bad:#ff7b8a;
  --streak:#ff9e42;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:18px; line-height:1.5;
  background:
    radial-gradient(900px 500px at 10% -5%, rgba(159,126,255,0.35), transparent 60%),
    radial-gradient(850px 500px at 95% 10%, rgba(255,123,213,0.22), transparent 60%),
    radial-gradient(900px 700px at 50% 115%, rgba(107,228,255,0.18), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:12px 16px 60px}

/* Header & Top Bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding:8px 4px 14px}
.brand{font-size:1.25rem;letter-spacing:.5px;font-weight:700}
.brand b{background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;align-items:center;gap:12px;font-size:.95rem;background:rgba(255,255,255,0.06);padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
.xpbar{width:110px;height:10px;border-radius:99px;background:rgba(255,255,255,0.12);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .4s}
.streak-badge{display:inline-flex;align-items:center;gap:4px;color:var(--streak);font-weight:bold;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.tools{display:flex;gap:8px;flex-wrap:wrap}

button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ghost,.tools button{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.85rem;transition:all .15s}
.ghost:hover,.tools button:hover{background:rgba(255,255,255,.16);border-color:var(--cyan)}
.tools button.on{border-color:var(--gold);color:var(--gold);background:rgba(255,216,107,0.14)}
.jump-btn{background:linear-gradient(135deg,rgba(255,216,107,.2),rgba(255,123,213,.2));border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:7px 12px;font-size:.85rem;font-weight:700}
.jump-btn:hover{background:linear-gradient(135deg,rgba(255,216,107,.35),rgba(255,123,213,.35))}

/* Primary / Interactive Buttons */
.primary{background:linear-gradient(135deg,var(--violet),var(--pink));border:0;border-radius:14px;padding:11px 22px;font-weight:700;box-shadow:0 6px 20px rgba(159,126,255,.35);transition:transform .15s,box-shadow .15s}
.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(159,126,255,.5)}
.primary:active{transform:translateY(1px)}
.skip{background:transparent;border:1px dashed rgba(255,255,255,0.25);color:var(--muted);border-radius:14px;padding:10px 18px;font-size:0.9rem;transition:.15s}
.skip:hover{border-color:var(--gold);color:var(--gold);background:rgba(255,216,107,0.06)}

/* Main Layout */
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.map{display:flex;flex-direction:column;gap:8px;position:sticky;top:12px}
.planet{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:.9rem;transition:all .15s;width:100%}
.planet .ic{font-size:1.4rem}
.planet small{display:block;color:var(--muted);font-size:.75rem}
.planet.cur{border-color:var(--gold);background:rgba(255,216,107,.12);box-shadow:0 0 16px rgba(255,216,107,.2)}
.planet.fin{border-color:rgba(93,242,165,.45)}
.planet.special{border:1px dashed var(--gold);background:rgba(255,216,107,0.05)}

/* Cards & Content */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 28px;backdrop-filter:blur(10px);box-shadow:0 14px 45px rgba(0,0,0,.4);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-header-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-block;font-size:.8rem;color:var(--cyan);border:1px solid rgba(107,228,255,.4);border-radius:99px;padding:3px 12px;font-weight:600}
.chip.gold{color:var(--gold);border-color:rgba(255,216,107,.5);background:rgba(255,216,107,.08)}
.chip.recap{color:#fff;border-color:var(--pink);background:linear-gradient(90deg,rgba(159,126,255,.3),rgba(255,123,213,.3))}
.goal{color:var(--muted);font-size:.86rem;margin:0 0 14px}
h3{font-size:1.55rem;margin:4px 0 14px;line-height:1.28;letter-spacing:-0.2px}
.rich p{margin:0 0 12px}
.rich ul{margin:6px 0 12px;padding-left:22px}
.rich li{margin:5px 0}
.muted{color:var(--muted);font-size:.9rem}
.big{font-size:1.2rem}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pill-btn{background:rgba(255,255,255,0.08);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:0.85rem;color:var(--text);transition:all .15s}
.pill-btn:hover{border-color:var(--gold);background:rgba(255,216,107,0.15);color:var(--gold)}

/* Interactive Grid & Tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.tile{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--cyan)}
.tile .em{font-size:1.8rem;display:block;margin-bottom:4px}
.tile b{color:var(--gold)}

.opts{display:grid;gap:10px;margin:12px 0}
.opt,.chipb{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-align:left;transition:.15s;font-weight:500}
.opt:hover,.chipb:hover{border-color:var(--cyan);background:rgba(107,228,255,.12);transform:translateX(3px)}
.opt.right{border-color:var(--good)!important;background:rgba(93,242,165,.18)!important;color:#fff}
.opt.wrong{border-color:var(--bad)!important;background:rgba(255,123,138,.15)!important;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chipb{border-radius:99px;padding:9px 16px}
.chipb.on{border-color:var(--gold);background:rgba(255,216,107,.18);color:var(--gold);font-weight:700}
.chipb.ok{border-color:var(--good);background:rgba(93,242,165,.18);color:#fff}

.inp,textarea,select{width:100%;background:rgba(6,9,32,.7);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
textarea{min-height:95px;resize:vertical}
.inp:focus,textarea:focus,select:focus{outline:2px solid var(--violet);border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.row .inp{flex:1;min-width:180px}
label.f{display:block;margin:10px 0 4px;color:var(--gold);font-size:.9rem;font-weight:600}
.fb{margin-top:10px;min-height:10px}
.good,.bad,.info-fb{padding:11px 15px;border-radius:12px;font-size:.96rem;animation:rise .25s ease both}
.good{background:rgba(93,242,165,.14);border:1px solid rgba(93,242,165,.45);color:#d9ffe9}
.bad{background:rgba(255,123,138,.12);border:1px solid rgba(255,123,138,.45);color:#ffe0e4}
.info-fb{background:rgba(107,228,255,.12);border:1px solid rgba(107,228,255,.4);color:#e2f9ff}

.sortcard{font-size:1.45rem;text-align:center;padding:24px 18px;margin:12px 0;border:2px dashed var(--violet);border-radius:18px;background:rgba(159,126,255,.1);animation:rise .25s ease both;font-weight:600}
.buckets{display:flex;gap:10px;flex-wrap:wrap}
.bucket{flex:1;min-width:130px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:12px 10px;font-weight:700;transition:all .15s}
.bucket:hover:not(:disabled){border-color:var(--gold);background:rgba(255,216,107,.15);transform:translateY(-2px)}
.bucket.wrong{border-color:var(--bad);opacity:.5}

.redact{line-height:2.4;margin:12px 0}
.tok{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 2px;font-size:1rem;transition:all .15s}
.tok.hid{background:#000;color:#000;border-color:#555;box-shadow:inset 0 0 8px rgba(255,255,255,0.2)}

.crit{list-style:none;padding:0;margin:10px 0}
.crit li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.95rem}
.crit .tip{display:block;color:var(--muted);font-size:.8rem;margin-left:28px}
.quote{border-left:3px solid var(--gold);background:rgba(255,216,107,.08);padding:8px 14px;border-radius:0 10px 10px 0;margin:8px 0;font-style:italic}
.bad-prompt{background:rgba(255,123,138,.1);border:1px dashed var(--bad);border-radius:12px;padding:10px 14px;margin:8px 0}
.out{background:rgba(6,9,32,.75);border:1px solid var(--cyan);border-radius:14px;padding:12px 16px;margin:12px 0;white-space:pre-wrap;font-family:Consolas,monospace;font-size:.92rem}
.seq{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.seq div{background:rgba(159,126,255,.18);border:1px solid var(--violet);border-radius:12px;padding:9px 14px}
.seq div.okp{border-color:var(--good);background:rgba(93,242,165,.14)}
.seq div.nop{border-color:var(--bad);background:rgba(255,123,138,.1)}

.range{width:100%;accent-color:var(--gold)}
.scalev{font-size:2.4rem;text-align:center;color:var(--gold);font-weight:700}
.scalel{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.timer{font-size:3.5rem;text-align:center;color:var(--gold);font-weight:700;margin:8px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:rgba(255,255,255,.05);cursor:pointer;transition:.15s}
.chk:hover{background:rgba(255,255,255,.08)}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--gold)}

/* Navigation Controls - Completely Unblocked */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.nav-actions{display:flex;align-items:center;gap:10px}
#dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
#dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:transform .15s}
#dots i:hover{transform:scale(1.3)}
#dots i.d{background:var(--good)} 
#dots i.c{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.28)}

.teacher{background:rgba(255,216,107,.1);border:1px dashed var(--gold);border-radius:16px;padding:12px 16px;margin-bottom:14px;font-size:.92rem}
.cert{background:linear-gradient(160deg,#10163e,#2a1763);border:3px double var(--gold);border-radius:22px;padding:28px 24px;text-align:center}
.labsteps{padding-left:24px;margin:10px 0}
.labsteps li{margin:7px 0}
.chip.lab{color:var(--gold);border-color:rgba(255,216,107,.5)}
h4{font-size:1.1rem;margin:16px 0 8px;color:var(--cyan)}
.cert h2{font-size:1.9rem;margin:0 0 6px;color:var(--gold)}
.cert .nm{font-size:2.2rem;margin:10px 0;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.cert p{margin:6px 0}
.danger{border-color:var(--bad)!important;color:var(--bad)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark{position:absolute;font-size:18px;color:var(--gold);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.xpf{position:absolute;font-weight:700;color:var(--gold);font-size:1.25rem;text-shadow:0 0 10px #000;animation:upf 1.1s ease-out forwards}
@keyframes upf{to{transform:translateY(-60px);opacity:0}}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,5,20,.85);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .box{background:var(--card);border:2px solid var(--gold);border-radius:24px;padding:30px;max-width:460px;text-align:center;animation:rise .4s ease both}
.bigicon{font-size:4.2rem;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
body.calm *,body.calm *::before{animation:none!important;transition:none!important}
@media (max-width:840px){
  .layout{grid-template-columns:1fr}
  .map{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px}
  .planet{min-width:130px;flex-direction:column;text-align:center;gap:3px}
  .planet small{display:none}
  body{font-size:17px}
  .card{padding:20px 16px}
}
@media print{
  body *{visibility:hidden}
  #cert,#cert *{visibility:visible}
  #cert{position:absolute;left:0;top:0;width:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="app">
  <header class="top">
    <div class="brand">🌌 <b>Cosmic AI Academy</b></div>
    <div class="stats">
      <span id="streak" class="streak-badge" title="Combo Streak">🔥 0 streak</span>
      <span id="lvl">Lv 1</span>
      <div class="xpbar"><i id="xpfill"></i></div>
      <span id="xp">0 XP</span>
    </div>
    <div class="tools">
      <button id="resumeBtn" class="jump-btn" title="Jump straight to Mission 5 or Recap">⚡ Jump to 2nd Half</button>
      <button id="calmBtn" title="Turns off animations">🌙 Calm mode</button>
      <button id="teachBtn">👩‍🏫 Teacher</button>
    </div>
  </header>
  <div class="layout">
    <nav id="map" class="map" aria-label="Missions"></nav>
    <main>
      <div id="teacher" class="teacher" hidden></div>
      <section class="card" id="card"></section>
      <div class="nav">
        <button id="back" class="ghost">← Back</button>
        <div id="dots"></div>
        <div class="nav-actions">
          <button id="skip" class="skip">Skip for now →</button>
          <button id="next" class="primary">Next →</button>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="fx"></div>

<script>
/* ================= Sound FX (Tone.js, Synthesized) ================= */
let soundEnabled = true;
const soundFX = {
  success: () => {
    if(!soundEnabled) return;
    try {
      const synth = new Tone.PolySynth(Tone.Synth).toDestination();
      synth.volume.value = -12;
      synth.triggerAttackRelease(["E5", "G#5", "B5"], "16n");
    } catch(e){}
  },
  combo: () => {
    if(!soundEnabled) return;
    try {
      const synth = new Tone.PolySynth(Tone.Synth).toDestination();
      synth.volume.value = -10;
      synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n");
    } catch(e){}
  },
  click: () => {
    if(!soundEnabled) return;
    try {
      const membrane = new Tone.MembraneSynth().toDestination();
      membrane.volume.value = -18;
      membrane.triggerAttackRelease("C3", "32n");
    } catch(e){}
  }
};

/* ================= Helpers & Persistent State ================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const KEY = 'cosmicAI_lesson_v4_adhd';
const fresh = () => ({name:'',xp:180,m:4,s:0,done:{},ans:{},calm:false,teacher:false,streak:3});
function load(){
  try{ 
    const r=localStorage.getItem(KEY); 
    if(r) return Object.assign(fresh(), JSON.parse(r)); 
  }catch(e){} 
  return fresh(); 
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches && !S.calm){ S.calm = true; }

const TITLES = ['Stargazer','Comet Rider','Star Pilot','Nebula Navigator','Galaxy Guide','Cosmic Captain','Supernova Captain','Cosmic Overlord'];
const level = () => Math.floor(S.xp/100);
const rank = () => TITLES[Math.min(level(), TITLES.length-1)];

/* ================= Visual & Reward Effects ================= */
function burst(elm){
  if(S.calm) return;
  const fx=$('#fx'); 
  const r=(elm && elm.getBoundingClientRect) ? elm.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0, height:0};
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<16;i++){
    const s=document.createElement('span'); s.className='spark'; s.textContent=['✦','✧','★','✨','🚀'][i%5];
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.setProperty('--dx',(Math.random()*260-130)+'px'); s.style.setProperty('--dy',(Math.random()*220-140)+'px');
    s.style.color=['#ffd86b','#6be4ff','#ff7bd5','#9f7eff','#5df2a5'][i%5];
    fx.appendChild(s); setTimeout(()=>s.remove(),950);
  }
}

function floatXP(txt){
  if(S.calm) return;
  const t=$('#xp').getBoundingClientRect(); const s=document.createElement('div');
  s.className='xpf'; s.textContent=txt; s.style.left=(t.left)+'px'; s.style.top=(t.bottom+4)+'px';
  $('#fx').appendChild(s); setTimeout(()=>s.remove(),1150);
}

function overlay(html, btnText, cb){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="box">${html}<p style="margin-top:20px"><button class="primary" id="ovb">${btnText}</button></p></div>`;
  document.body.appendChild(o);
  $('#ovb',o).onclick=()=>{ 
    Tone.start(); soundFX.click();
    o.remove(); cb&&cb(); 
  };
  burst($('.bigicon',o)||o);
}

function copyText(text, btn){
  const label=btn.dataset.l||btn.textContent; btn.dataset.l=label;
  const ta=document.createElement('textarea'); ta.value=text; 
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); btn.textContent='Copied ✓'; soundFX.success(); }
  catch(e) { btn.textContent='Select to copy'; }
  ta.remove();
  setTimeout(()=>{btn.textContent=label;},1600);
}

function fb(root, ok, msg, isInfo=false){
  const f=root.querySelector('.fb'); if(!f) return;
  if(isInfo){
    f.innerHTML=`<div class="info-fb">💡 ${msg}</div>`;
  } else {
    f.innerHTML=`<div class="${ok?'good':'bad'}">${ok?'✨ ':'🌑 '}${msg}</div>`;
  }
}

/* ================= Criteria & Rubrics ================= */
const CRIT=[
 {id:'role',label:'Role: who should the AI be?',tip:'Try: "Act as a friendly teacher..."',test:t=>/\b(act as|you are|pretend|imagine you|as a|be my|role of)\b/i.test(t)},
 {id:'task',label:'Clear task: what exactly to create?',tip:'Say what to create in a full thought.',test:t=>t.trim().split(/\s+/).length>=5},
 {id:'ctx',label:'Context: who is it for and why?',tip:'Add who it is for or your level.',test:t=>/\b(for (a|an|my|me|the)|my|i am|i'm|because|audience|beginner|student|class|grade|years? old|so that|i need|i want)\b/i.test(t)},
 {id:'fmt',label:'Format: how the answer looks',tip:'Ask for bullets, a table, 3 steps...',test:t=>/\b(bullets?|list|table|steps?|words|sentences?|paragraphs?|short|max|outline|summary)\b/i.test(t)},
 {id:'lim',label:'Limits or style: what to avoid',tip:'Add a tone (funny, simple) or limit (no jargon).',test:t=>/\b(don't|do not|avoid|only|no more than|limit|tone|friendly|funny|simple|casual|fun|short)\b/i.test(t)}
];

const PRO=[
 {label:'Step by step: asks for reasoning',tip:'Add "think step by step" or "first... then...".',test:t=>/\b(step by step|step-by-step|steps|first|then|reasoning|think through)\b/i.test(t)},
 {label:'Real details: dates, time, level',tip:'Add exam dates, hours, or focus struggles.',test:t=>t.trim().split(/\s+/).length>=12},
 {label:'Format: structure of output',tip:'Ask for table, checklist, or short blocks.',test:t=>/\b(table|bullets?|list|format|checklist|outline|blocks)\b/i.test(t)},
 {label:'Self-check or questions',tip:'Add "ask me questions first" or "check for errors".',test:t=>/\b(check|verify|questions|ask me|assumptions)\b/i.test(t)}
];

/* ================= LESSON CONTENT ================= */
const MISSIONS=[
/* ---------- 1: Launch Pad ---------- */

const PASSIVE = new Set(['info','toolkit','recap_cards']);
const T = {};

T.info = (st,el,api) => {
  el.innerHTML = `<h3>${st.title}</h3><div class="rich">${st.body}</div>`;
};

T.name = (st,el,api) => {
  el.innerHTML = `
    <h3>${st.title}</h3>
    <div class="rich">${st.body}</div>
    <div class="row">
      <input id="nm" class="inp" maxlength="30" placeholder="Type your space explorer name..." value="${esc(S.name||'')}">
      <button class="primary" id="go">Blast Off 🚀</button>
    </div>
    <div class="fb"></div>`;
  const go = () => {
    const v = $('#nm',el).value.trim() || 'Cosmic Pioneer';
    S.name = v; save();
    soundFX.success();
    burst($('#go',el));
    api.done(15);
    fb(el, true, `Welcome aboard, <b>${esc(v)}</b>! Tap <i>Next</i> to launch.`);
  };
  $('#go',el).onclick = go;
  $('#nm',el).onkeydown = e => { if(e.key === 'Enter') go(); };
};

T.choice = (st,el,api) => {
  let solved = false;
  el.innerHTML = `
    <h3>${st.q}</h3>
    <div class="opts">
      ${st.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="fb"></div>`;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    Tone.start();
    const i = +b.dataset.i;
    if(i === st.a){
      if(!solved){
        solved = true;
        b.classList.add('right');
        soundFX.success();
        burst(b);
        api.addStreak();
        api.done(15);
      }
      fb(el, true, st.why || 'Spot on!');
    } else {
      b.classList.add('wrong');
      soundFX.click();
      fb(el, false, 'Not quite that one! Try another button or feel free to skip ahead anytime.');
    }
  });
};

T.open = (st,el,api) => {
  const chipsHtml = (st.chips && st.chips.length) ? `
    <div class="muted" style="margin-top:6px">Or tap an idea to fill instantly:</div>
    <div class="pill-row">
      ${st.chips.map(c=>`<button class="pill-btn" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>` : '';

  el.innerHTML = `
    <h3>${st.q}</h3>
    <textarea id="ta" placeholder="${esc(st.ph||'Your thoughts...')}">${esc(S.ans[st.key]||'')}</textarea>
    ${chipsHtml}
    <div class="row">
      <button class="primary" id="sv">Save Answer ✨</button>
      <span class="muted" id="status"></span>
    </div>
    <div class="fb"></div>`;
  
  const ta = $('#ta',el);
  el.querySelectorAll('.pill-btn').forEach(btn => btn.onclick = () => {
    ta.value = btn.dataset.c;
    soundFX.click();
  });

  $('#sv',el).onclick = () => {
    Tone.start();
    const val = ta.value.trim() || '(Skipped with blank)';
    S.ans[st.key] = val; save();
    soundFX.success();
    burst($('#sv',el));
    api.done(15);
    fb(el, true, st.after || 'Answer recorded! Great work.');
  };
};

T.multi = (st,el,api) => {
  const sel = new Set();
  el.innerHTML = `
    <h3>${st.q}</h3>
    <div class="chips">
      ${st.opts.map((o,i)=>`<button class="chipb" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="row">
      <button class="primary" id="chk">Lock Selection</button>
    </div>
    <div class="fb"></div>`;
  
  const chips = [...el.querySelectorAll('.chipb')];
  chips.forEach(b => b.onclick = () => {
    Tone.start(); soundFX.click();
    const i = +b.dataset.i;
    if(sel.has(i)){ sel.delete(i); b.classList.remove('on'); }
    else {
      if(st.max && sel.size >= st.max){
        b.classList.add('shake');
        setTimeout(()=>b.classList.remove('shake'),350);
        return;
      }
      sel.add(i); b.classList.add('on');
    }
  });

  $('#chk',el).onclick = () => {
    Tone.start();
    if(st.correct){
      const ok = [...sel].filter(i => st.correct.includes(i)).length;
      const wrong = sel.size - ok;
      if(ok >= 1 && wrong === 0){
        soundFX.success(); burst($('#chk',el));
        api.addStreak(); api.done(20);
        fb(el, true, st.after || 'Radar accurate!');
      } else {
        chips.forEach((b,i) => {
          if(st.correct.includes(i)) b.classList.add('ok');
        });
        soundFX.click(); api.done(10);
        fb(el, true, 'Great effort! We highlighted the verified picks in green for you.');
      }
    } else {
      soundFX.success(); burst($('#chk',el));
      api.done(15);
      fb(el, true, st.after || 'Selections saved!');
    }
    S.ans[st.key] = [...sel].map(i => st.opts[i]); save();
  };
};

T.scale = (st,el,api) => {
  el.innerHTML = `
    <h3>${st.q}</h3>
    <div class="scalev" id="sv">5</div>
    <input class="range" id="rg" type="range" min="0" max="10" value="5">

  $('#lk',el).onclick = () => {

T.sort = (st,el,api) => {
  const items = shuffle(st.items.slice());
  let i = 0, correctCount = 0;
  const draw = () => {
    if(i >= items.length){
      el.innerHTML = `
        <h3>Sorting Complete! 🎉</h3>
        <p class="big">You classified <b>${correctCount}</b> out of ${items.length} correctly!</p>
        <p class="muted">Press <b>Next</b> to roll into the next challenge.</p>`;
      burst($('h3',el)); soundFX.combo();
      api.done(25); api.addStreak();
      return;
    }
    const it = items[i];
    el.innerHTML = `
      <h3>${st.q}</h3>
      <div class="muted">Card ${i+1} of ${items.length}</div>
      <div class="sortcard">${esc(it.x)}</div>
      <div class="buckets">
        ${st.buckets.map(b => `<button class="bucket" data-b="${b.id}">${b.icon} ${b.label}</button>`).join('')}
      </div>
      <div class="fb"></div>`;

    el.querySelectorAll('.bucket').forEach(btn => btn.onclick = () => {
      Tone.start();
      if(btn.dataset.b === it.b){
        correctCount++;
        soundFX.success(); burst(btn);
        el.querySelectorAll('.bucket').forEach(x => x.disabled = true);
        fb(el, true, `${esc(it.why || 'Correct!')}<br><button class="primary" id="nc" style="margin-top:10px;padding:6px 14px;font-size:0.9rem">Next Card →</button>`);
        $('#nc',el).onclick = () => { i++; draw(); };
      } else {
        soundFX.click();
        btn.classList.add('wrong');
        fb(el, false, 'Not quite! Try the other category or tap it again.');
      }
    });
  };
  draw();
};

T.rewrite = (st,el,api) => {
  const templates = st.templates || [];
  const chips = templates.map(t => `<button class="pill-btn" data-t="${esc(t)}">Use Template: "${esc(t.slice(0,38))}..."</button>`).join('');

  el.innerHTML = `
    <h3>${st.q}</h3>
    ${st.bad ? `<div class="bad-prompt">❌ Weak: <i>"${esc(st.bad)}"</i></div>` : ''}
    <textarea id="ta" placeholder="${esc(st.ph||'Draft your prompt here...')}">${esc(S.ans[st.key]||'')}</textarea>
    ${templates.length ? `<div class="muted">Or 1-click a power template:</div><div class="pill-row">${chips}</div>` : ''}
    <div class="row">
      <button class="primary" id="ck">Check Prompt Strength</button>
    </div>
    <ul class="crit" id="cr"></ul>
    <div class="fb"></div>`;

  const ta = $('#ta',el);
  el.querySelectorAll('.pill-btn').forEach(btn => btn.onclick = () => {
    ta.value = btn.dataset.t; soundFX.click();
  });

  const check = () => {
    Tone.start();
    const t = ta.value.trim();
    if(!t){ fb(el, false, 'Type a prompt or click one of the template pills!'); return; }
    S.ans[st.key] = t; save();
    const met = CRIT.filter(c => c.test(t)).length;
    $('#cr',el).innerHTML = CRIT.map(c => `<li>${c.test(t)?'✅':'⬜'} ${c.label}</li>`).join('');
    if(met >= 2){
      soundFX.success(); burst($('#ck',el));
      api.addStreak(); api.done(20);
      fb(el, true, `High impact prompt! Detected ${met} power ingredients.`);
    } else {
      soundFX.click(); api.done(10);
      fb(el, true, 'Great draft! Keep it or try adding a role or a format constraint.');
    }
  };
  $('#ck',el).onclick = check;
};

T.order = (st,el,api) => {
  let seq = [];
  const pool = shuffle(st.items.map((x,i)=>({x,i})));
  const draw = () => {
    const left = pool.filter(p => !seq.includes(p));
    el.innerHTML = `
      <h3>${st.q}</h3>
      <div class="seq">
        ${seq.map((p,idx)=>`<div>${idx+1}. ${esc(p.x)}</div>`).join('')}
      </div>
      <div class="opts">
        ${left.map(p => `<button class="opt" data-i="${p.i}">+ ${esc(p.x)}</button>`).join('')}
      </div>
      <div class="row">
        <button class="ghost" id="un">Undo</button>
        <button class="ghost" id="rs">Reset</button>
        <button class="primary" id="ck" ${seq.length < st.items.length ? 'disabled' : ''}>Check Sequence</button>
      </div>
      <div class="fb"></div>`;

    el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      Tone.start(); soundFX.click();
      seq.push(pool.find(p => p.i === +b.dataset.i));
      draw();
    });
    $('#un',el).onclick = () => { seq.pop(); draw(); };
    $('#rs',el).onclick = () => { seq = []; draw(); };
    $('#ck',el).onclick = () => {
      Tone.start();
      const right = seq.filter((p,idx) => p.i === idx).length;
      if(right === st.items.length){
        soundFX.combo(); burst($('#ck',el));
        api.addStreak(); api.done(25);
        fb(el, true, 'Flawless workflow order!');
      } else {
        soundFX.success(); api.done(10);
        fb(el, true, `${right} of ${st.items.length} matched. You still grasp the chain concept—press Next when ready!`);
      }
    };
  };
  draw();
};

      <h3>${esc(q.q)}</h3>
      <div class="opts">
        ${q.opts.map((opt,idx)=>`<button class="opt" data-idx="${idx}">${esc(opt)}</button>`).join('')}
      </div>
      <div class="fb"></div>`;

    el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      Tone.start();
      const idx = +b.dataset.idx;
      if(idx === q.a){
        score++; soundFX.success(); burst(b);
      } else {
        soundFX.click();
      }
      currQ++;
      setTimeout(draw, 350);
    });
  };
  draw();
};

/* Rapid Redaction */
T.redact_rapid = (st,el,api) => {
  const hid = new Set();
  el.innerHTML = `
    <h3>${st.q}</h3>
    <p class="muted">Tap chunks to black them out before sending to an AI.</p>
    <div class="redact">
      ${st.tokens.map((t,i)=>`<button class="tok" data-i="${i}">${esc(t[0])}</button>`).join(' ')}
    </div>
    <div class="row">
      <button class="primary" id="chk">Check Shield</button>
      <button class="ghost" id="reveal">Show Safe Version</button>
    </div>
    <div class="fb"></div>`;

  el.querySelectorAll('.tok').forEach(b => b.onclick = () => {
    Tone.start(); soundFX.click();
    const i = +b.dataset.i;
    if(hid.has(i)){ hid.delete(i); b.classList.remove('hid'); }
    else { hid.add(i); b.classList.add('hid'); }
  });

  const check = () => {
    Tone.start();
    const correctItems = st.tokens.map((t,i) => t[1] ? i : -1).filter(i => i !== -1);
    const missed = correctItems.filter(i => !hid.has(i)).length;
    if(missed === 0){
      soundFX.combo(); burst($('#chk',el));
      api.addStreak(); api.done(25);
      fb(el, true, 'Shields up! You safely censored all identifying info.');
    } else {
      soundFX.click();
      correctItems.forEach(i => {
        const b = el.querySelector(`.tok[data-i="${i}"]`);
        if(b) b.classList.add('hid');
      });
      api.done(10);
      fb(el, true, 'Shield completed! Notice how the AI can still answer without names or addresses.');
    }
  };
  $('#chk',el).onclick = check;
  $('#reveal',el).onclick = () => {
    st.tokens.forEach((t,i) => {
      if(t[1]){
        const b = el.querySelector(`.tok[data-i="${i}"]`);
        if(b) b.classList.add('hid');
      }
    });
    check();
  };
};

/* ================= Engine & Flow ================= */
const cur = () => MISSIONS[S.m].steps[S.s];
const sid = () => S.m + '-' + S.s;

function makeApi(){
  const id = sid();
  return {
    done(xp){
      if(!S.done[id]){
        const before = level();
        S.done[id] = 1;
        S.xp += xp;
        save();
        renderHud();
        renderMap();
        renderDots();
        floatXP(`+${xp} XP`);
        if(level() > before) setTimeout(()=>floatXP('Level Up! ⭐'), 500);
      }
    },
    addStreak(){
      S.streak = (S.streak || 0) + 1;
      save();
      renderHud();
    }
  };
}

function renderHud(){
  $('#lvl').textContent = 'Lv ' + level() + ' · ' + rank();
  $('#xp').textContent = S.xp + ' XP';
  $('#xpfill').style.width = (S.xp % 100) + '%';
  $('#streak').textContent = `🔥 ${S.streak||0} streak`;
}

function renderMap(){
  $('#map').innerHTML = MISSIONS.map((m,i)=>{
    const n = m.steps.filter((_,k)=>S.done[i+'-'+k]).length;
    const fin = n === m.steps.length;
    const specialClass = m.isRecap ? 'special' : '';
    return `
      <button class="planet ${i===S.m?'cur':''} ${fin?'fin':''} ${specialClass}" data-i="${i}">
        <span class="ic">${fin ? '✅' : m.icon}</span>
        <span>${i+1}. ${m.name}<small>${n}/${m.steps.length} done</small></span>
      </button>`;
  }).join('');

  document.querySelectorAll('.planet').forEach(b => b.onclick = () => {
    Tone.start(); soundFX.click();
    const i = +b.dataset.i;
    S.m = i; S.s = 0; save(); render();
  });
}

function renderDots(){
  $('#dots').innerHTML = MISSIONS[S.m].steps.map((_,k)=>`
    <i class="${k===S.s?'c':(S.done[S.m+'-'+k]?'d':'')}" data-s="${k}" title="Step ${k+1}"></i>
  `).join('');
  elDots = document.querySelectorAll('#dots i');
  elDots.forEach(d => d.onclick = () => {
    Tone.start(); soundFX.click();
    S.s = +d.dataset.s; save(); render();
  });
}

function renderTeacher(){
  const box = $('#teacher');
  box.hidden = !S.teacher;
  if(!S.teacher) return;
  const M = MISSIONS[S.m];
  box.innerHTML = `👩‍🏫 <b>Teacher View · Mission ${S.m+1}: ${M.name}</b><br>${esc(M.tip)}`;
}

function updateNav(){
  const isLast = S.m === MISSIONS.length-1 && S.s === MISSIONS[S.m].steps.length-1;
  $('#next').hidden = isLast;
  $('#skip').hidden = isLast;
  $('#back').disabled = (S.m === 0 && S.s === 0);
  // UNBLOCKED: 'Next' is NEVER disabled! Students can always move ahead.
  $('#next').disabled = false;
}

function render(){
  document.body.classList.toggle('calm', !!S.calm);
  $('#calmBtn').classList.toggle('on', !!S.calm);
  $('#teachBtn').classList.toggle('on', !!S.teacher);

  const M = MISSIONS[S.m], st = cur();
  const card = $('#card');
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';

  const badgeClass = M.isRecap ? 'chip recap' : 'chip';
  card.innerHTML = `
    <div class="card-header-bar">
      <span class="${badgeClass}">${M.icon} Mission ${S.m+1}: ${esc(M.name)}</span>
      <span class="muted" style="font-size:0.85rem">Step ${S.s+1} of ${M.steps.length}</span>
    </div>
    <p class="goal">${esc(M.goal)}</p>
    <div id="body"></div>`;

  T[st.t](st, $('#body'), makeApi());
  renderHud(); renderMap(); renderDots(); renderTeacher(); updateNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

function advance(){
  Tone.start(); soundFX.click();
  const M = MISSIONS[S.m];
  if(S.s < M.steps.length - 1){
    S.s++; save(); render(); return;
  }
  // Mission finished!
  S.xp += 25; save(); renderHud();
  const nm = MISSIONS[S.m+1];
  if(!nm) return;

  overlay(`
    <div class="bigicon">${M.icon}</div>
    <h2>Mission ${S.m+1} Cleared!</h2>
    <p>+25 XP Mission Bonus awarded!<br>Up next: <b>${nm.icon} ${esc(nm.name)}</b></p>
  `, 'Fly Ahead 🚀', () => {
    S.m++; S.s = 0; save(); render();
  });
}

$('#next').onclick = () => {
  const id = sid();
  if(!S.done[id]){
    S.done[id] = 1;
    S.xp += 5;
    save();
  }
  advance();
};

$('#skip').onclick = () => {
  Tone.start(); soundFX.click();
  advance();
};

$('#back').onclick = () => {
  Tone.start(); soundFX.click();
  if(S.s > 0) S.s--;
  else if(S.m > 0){
    S.m--; S.s = MISSIONS[S.m].steps.length - 1;
  }
  save(); render();
};

$('#calmBtn').onclick = () => { S.calm = !S.calm; save(); render(); };
$('#teachBtn').onclick = () => { S.teacher = !S.teacher; save(); render(); };

/* ================= Starry Sky Ambient Background ================= */
(function(){
  const c = $('#sky'), x = c.getContext('2d');
  let w = 0, h = 0, stars = [];
  function size(){
    w = c.width = innerWidth; h = c.height = innerHeight;
    stars = Array.from({length: Math.min(180, Math.floor(w*h/8000))}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*1.3 + 0.3,
      p: Math.random()*6.28,
      s: Math.random()*0.02 + 0.005
    }));
  }
  function frame(){
    x.clearRect(0,0,w,h);
    const calm = document.body.classList.contains('calm');
    for(const s of stars){
      s.p += s.s;
      x.globalAlpha = calm ? 0.6 : (0.4 + 0.5 * Math.sin(s.p));
      x.fillStyle = '#fff';
      x.beginPath();
      x.arc(s.x, s.y, s.r, 0, 6.283);
      x.fill();
    }
    x.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  addEventListener('resize', size);
  size(); frame();
})();

render();
</script>
